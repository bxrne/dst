openapi: 3.0.1
info:
  version: '1.0-oas3'
  title: httpbin
  description: An unofficial OpenAPI definition for httpbin.org
servers:
  - url: https://httpbin.org
  - url: http://httpbin.org
paths:
  /:
    get:
      summary: The current time
      tags:
        - time
      responses:
        '200':
          description: OK
  /get:
    get:
      tags:
        - HTTP methods
      summary: Returns the GET request's data
      responses:
        '200':
          description: OK
  /post:
    post:
      tags:
        - HTTP methods
      summary: Returns the POSTed data
      responses:
        '200':
          description: OK
  /put:
    put:
      tags:
        - HTTP methods
      summary: Returns the PUTed data
      responses:
        '200':
          description: OK
  /patch:
    patch:
      tags:
        - HTTP methods
      summary: Returns the PATCHed data
      responses:
        '200':
          description: OK
  /delete:
    delete:
      tags:
        - HTTP methods
      summary: Returns the DELETE request's data
      responses:
        '200':
          description: OK
  /status/{statusCode}:
    summary: Returns the specified HTTP status code
    parameters:
      - name: statusCode
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Status codes
      responses:
        default:
          description: A response with the requested status code
    post:
      tags:
        - Status codes
      responses:
        default:
          description: A response with the requested status code
  /headers:
    get:
      summary: Returns the request headers
      responses:
        '200':
          description: OK
  /ip:
    get:
      summary: Returns Origin IP
      responses:
        '200':
          description: OK
  /user-agent:
    get:
      summary: Returns the user agent
      responses:
        '200':
          description: OK
  /delay/{n}:
    get:
      summary: Delays responding for min(n, 10) seconds
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /xml:
    get:
      summary: Returns some XML
      responses:
        '200':
          description: OK
  /html:
    get:
      summary: Returns an HTML page
      responses:
        '200':
          description: OK
  /cache:
    get:
      summary: Returns 200 unless If-Modified-Since or If-None-Match is provided
      responses:
        '200':
          description: OK
        '304':
          description: Conditional request matched
components:
  schemas: {}
